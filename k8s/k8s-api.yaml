apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  # property-like keys; each key maps to a simple value
  PORT: "8000"
  DB_HOST: "db"

---

apiVersion: v1
kind: Secret
metadata:
  name: api-secret
type: Opaque
data:
  DB_PASS: MTIzNA== # 1234
  DB_USER: Z2VybWFudGVz # germantes
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-deployment
  template:
    metadata:
      labels:
        app: api-deployment
    spec:
      containers:
      - name: api-deployment
        image: repasoaws-api
        imagePullPolicy: Never               # No buscar en registry externo (imagen local)
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: api-config
        - secretRef:
            name: api-secret

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
            httpHeaders:
            - name: Custom-Header
              value: Awesome
          initialDelaySeconds: 3
          periodSeconds: 3
          
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector: 
    app: api-deployment
  type: NodePort
  ports:
    - port: 80
      # By default and for convenience, the `targetPort` is set to
      # the same value as the `port` field.
      targetPort: 8000
      nodePort: 30007
